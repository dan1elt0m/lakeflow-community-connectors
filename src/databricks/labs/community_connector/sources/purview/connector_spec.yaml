# purview Community Connector Spec
# This file defines the specification for the connector including
# connection parameters and allowlist options.

# ============================================================================
# Connection Parameters
# These are provided when creating the Unity Catalog connection.
# ============================================================================
display_name: Microsoft Purview
connection:
  parameters:
    - name: purview_account_name
      type: string
      required: true
      description: >
        The Purview account name used to construct the base URL for the
        Data Map API (classic portal). For example, if the account name is
        "mycompany", the Data Map API base URL will be
        https://mycompany.purview.azure.com/

    - name: auth_method
      type: string
      required: false
      description: >
        Authentication method. Options: "default_credential" (uses
        DefaultAzureCredential — tries az cli, env vars, managed identity),
        or "client_secret" (uses explicit tenant_id/client_id/client_secret).
        Defaults to "default_credential".

    - name: tenant_id
      type: string
      required: false
      description: >
        Azure AD tenant ID (GUID). Required only when auth_method is
        "client_secret".

    - name: client_id
      type: string
      required: false
      description: >
        Application (client) ID (GUID). Required only when auth_method is
        "client_secret".

    - name: client_secret
      type: string
      required: false
      secret: true
      description: >
        Client secret value. Required only when auth_method is
        "client_secret".

# ============================================================================
# External Options Allowlist
# These table-specific options must be included in the externalOptionsAllowList
# parameter of the UC connection to allow them to be passed through.
# Use a comma-separated string of option names.
# If no table-specific options are needed, set to empty string.
# ============================================================================
external_options_allowlist: "window_seconds,page_size,max_records_per_batch,start_timestamp"
